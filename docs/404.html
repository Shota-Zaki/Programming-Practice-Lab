<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="実際にコードを入力し、実行・検証しながら学ぶプログラミング学習サイト"
    />
    <title>Programming Practice Lab</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="status-panel" aria-labelledby="page-title">
        <p class="eyebrow">Development status</p>
        <h1 id="page-title">Programming Practice Lab</h1>
        <p class="lead">
          実際にコードを入力し、実行・検証しながら学ぶための環境を準備しています。
        </p>
        <div class="status-row" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span>GitHub Pages公開基盤は稼働中です</span>
        </div>
        <dl class="project-state">
          <div>
            <dt>現在</dt>
            <dd>公開構成と開発運用の初期化</dd>
          </div>
          <div>
            <dt>次工程</dt>
            <dd>UI方向性の比較・選定</dd>
          </div>
          <div>
            <dt>公開元</dt>
            <dd>main / docs</dd>
          </div>
        </dl>
        <p class="note">
          この画面は公開確認用の仮画面です。最終デザインではありません。
        </p>
      </section>
    </main>
  </body>
</html>
