name: Verify site and Pages output

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "AGENTS.md"
      - "task-list.md"
      - "DESIGN.md"
      - "README.md"
  push:
    branches:
      - main
      - work
    paths-ignore:
      - "AGENTS.md"
      - "task-list.md"
      - "DESIGN.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build and verify Pages output
        run: npm run verify
